openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product catalog
  - name: orders
    description: Cash-on-delivery orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List store products
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a cash-on-delivery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReceipt"
        "400":
          description: Invalid order
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [orders]
      summary: Check the current admin session
      responses:
        "200":
          description: Whether the current browser has an active admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: createAdminSession
      tags: [orders]
      summary: Sign in to the order dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Password is incorrect
    delete:
      operationId: deleteAdminSession
      tags: [orders]
      summary: Sign out of the order dashboard
      responses:
        "204":
          description: Admin session cleared
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [orders]
      summary: List customer orders for the admin dashboard
      responses:
        "200":
          description: Orders sorted newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "401":
          description: Admin session is required
  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrderStatus
      tags: [orders]
      summary: Update an order status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          description: Invalid order ID or status
        "401":
          description: Admin session is required
        "404":
          description: Order not found
    delete:
      operationId: deleteAdminOrder
      tags: [orders]
      summary: Permanently delete a customer order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Order deleted
        "400":
          description: Invalid order ID
        "401":
          description: Admin session is required
        "404":
          description: Order not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, brand, description, price, category, image, rating, badge]
      properties:
        id: { type: string }
        name: { type: string }
        brand: { type: string }
        description: { type: string }
        price: { type: integer }
        category: { type: string }
        image: { type: string }
        rating: { type: number }
        badge: { type: string }
    OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    OrderInput:
      type: object
      required: [customerName, phone, address, city, items]
      properties:
        customerName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, minLength: 7, maxLength: 20 }
        email: { type: ["string", "null"], maxLength: 254 }
        address: { type: string, minLength: 5, maxLength: 500 }
        city: { type: string, minLength: 2, maxLength: 100 }
        area: { type: ["string", "null"], maxLength: 100 }
        note: { type: ["string", "null"], maxLength: 1000 }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OrderLineInput"
    OrderReceipt:
      type: object
      required: [id, orderNumber, total, currency, status]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        total: { type: integer }
        currency: { type: string, enum: [BDT] }
        status: { type: string, enum: [pending, confirmed, shipped, delivered] }
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    AdminOrderLine:
      type: object
      required: [productId, name, unitPrice, quantity]
      properties:
        productId: { type: string }
        name: { type: string }
        unitPrice: { type: integer }
        quantity: { type: integer }
    AdminOrder:
      type: object
      required: [id, orderNumber, customerName, phone, address, city, items, total, currency, status, createdAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        customerName: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        address: { type: string }
        city: { type: string }
        area: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrderLine"
        total: { type: integer }
        currency: { type: string, enum: [BDT] }
        status: { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }
        createdAt: { type: string, format: date-time }
    AdminOrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }

